services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      # Explicit, not relying on any fallback default - debug routes
      # (backend/api/routes/debug.py) and CORS (main.py) now both fail
      # closed when ENVIRONMENT is unset, matching production-safe
      # defaults. Local dev opts back in explicitly here.
      - ENVIRONMENT=${ENVIRONMENT-development}
      - NEO4J_URI=${NEO4J_URI-bolt://neo4j:7687}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-legalcontracts_local_dev}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - NEO4J_DATABASE=${NEO4J_DATABASE-neo4j}
      - REDIS_URL=${REDIS_URL-redis://redis:6379}
      - CACHE_ENABLED=${CACHE_ENABLED-true}
      # Search re-ranking (backend/agents/reranker_service.py) - defaults
      # off (see phase3_config.py's comment). Only this service touches
      # it: reranking lives in search_strategies.py, invoked from the
      # enhanced_contract_search.py API route, which runs in this
      # service's FastAPI process, not `worker`'s Celery process below -
      # same reasoning already applied to the Google OIDC vars above.
      - RERANKING_ENABLED=${RERANKING_ENABLED-false}
      # Dev/test-only fault injection (reranker_service.py's rerank()) -
      # never set here by default, and deliberately absent from
      # docker-compose.prod.yml entirely, so it can't reach production even
      # if someone tried. Lets Phase 3's local E2E spec force a real
      # reranker failure and prove the UI still degrades gracefully to
      # vector-order results, without needing to actually break Gemini.
      - RERANKER_DEBUG_FORCE_FAILURE=${RERANKER_DEBUG_FORCE_FAILURE-}
      - OPENAI_API_KEY=${OPENAI_API_KEY-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY-}
      # Independent-audit finding #2: ANTHROPIC_API_KEY/MISTRAL_API_KEY were
      # never wired into this (local dev) compose file at all, unlike
      # docker-compose.prod.yml's backend/worker blocks (which already had
      # OPENAI/ANTHROPIC correctly). So even a correctly-set key in .env or
      # the shell could never reach these containers - model_registry.py's
      # os.getenv() check isn't the bug; the credential genuinely never
      # arrived. Mistral has no prod equivalent to match - model_registry.py
      # marks mistral-large production_allowed=False, so it was correctly
      # never wired into docker-compose.prod.yml; it's added here only
      # because local dev (ENVIRONMENT=development) isn't gated by that flag.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY-}
      # Output validation is fail-closed and bounded. Override only for
      # deliberate local failure-path verification or deployment tuning;
      # backend/main.py also defaults to 60 seconds when this is absent.
      - OUTPUT_GUARD_TIMEOUT_SECONDS=${OUTPUT_GUARD_TIMEOUT_SECONDS-60}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY-}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      # Google OIDC / org invites (credential-provisioning engagement) -
      # only api/auth_api.py + api/sso_api.py (this service) touch these;
      # `worker` runs Celery's analyze_contract_task, which never does, so
      # it's deliberately not duplicated in that service's environment
      # block below. Secrets get an empty-string fallback (never a real
      # value baked into this file) exactly like GOOGLE_API_KEY/
      # JWT_SECRET_KEY/ENCRYPTION_KEY above; the two non-secret ones
      # (redirect URI, sandbox sender) get a real usable default, same
      # convention as NEO4J_URI/REDIS_URL.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI-http://localhost:8000/api/auth/oidc/callback}
      - RESEND_API_KEY=${RESEND_API_KEY-}
      - INVITE_EMAIL_FROM=${INVITE_EMAIL_FROM-onboarding@resend.dev}
      # Defaults to the `ui` service's host-mapped port (3000:5173 below),
      # not Vite's bare dev-server default (5173) - a browser hitting this
      # link is on the host, same as it is for GOOGLE_OAUTH_REDIRECT_URI
      # above, not the Docker-internal network.
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL-http://localhost:3000}
      - PDF_SOURCE_STORAGE_DIR=/var/lib/contract-agent/source-pdfs
      - CHAT_ATTACHMENT_STORAGE_DIR=/var/lib/contract-agent/chat-attachments
    volumes:
      - pdf_source_data:/var/lib/contract-agent/source-pdfs
      - chat_attachment_data:/var/lib/contract-agent/chat-attachments
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net
    x-develop:
      watch:
        - action: rebuild
          path: ./backend
    ports:
      # Keep the documented 8000 default, but permit a non-destructive
      # local override when another project already owns that host port:
      # BACKEND_PORT=8001 docker compose up -d --build
      - "${BACKEND_PORT:-8000}:8000"
  worker:
    # Same image/build as `backend` (not a separate codebase) - just a
    # different entrypoint command, running Celery's own worker process
    # instead of the FastAPI dev server. Picks up backend/tasks.py's
    # analyze_contract_task via backend/celery_app.py.
    build:
      context: ./backend
      target: dev
    command: ["uv", "run", "celery", "-A", "backend.celery_app", "worker", "--loglevel=info"]
    # Reliability/observability audit finding #8: Docker's default
    # stop_grace_period is 10s - `docker stop`/a `docker-compose down`/an
    # orchestrator rollout sends SIGTERM, then SIGKILL after the grace
    # period regardless of whether a task is still running. Celery's
    # worker treats SIGTERM as a warm shutdown (stop accepting new tasks,
    # let in-flight ones finish), but 10s isn't enough time for this
    # system's one Celery task (backend/tasks.py's analyze_contract_task,
    # empirically 20-25s+, longer under partial-failure retry - see that
    # file's own docstring) to finish within it, so a routine deploy would
    # SIGKILL an in-flight analysis on every rollout. Combined with
    # task_acks_late=True (backend/celery_app.py) a SIGKILLed task is at
    # least safely requeued rather than lost - this setting is about
    # avoiding that requeue-and-retry cost on every routine restart, not
    # correctness by itself.
    stop_grace_period: 45s
    environment:
      - NEO4J_URI=${NEO4J_URI-bolt://neo4j:7687}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD-legalcontracts_local_dev}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - NEO4J_DATABASE=${NEO4J_DATABASE-neo4j}
      - REDIS_URL=${REDIS_URL-redis://redis:6379}
      - CACHE_ENABLED=${CACHE_ENABLED-true}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY-}
      # Independent-audit finding #2: worker previously only received
      # GOOGLE_API_KEY, so any model-selectable analysis/chat-adjacent path
      # running in the Celery worker process would only ever see Gemini as
      # configured, regardless of what was set in the environment. Matches
      # backend's full provider set now.
      - OPENAI_API_KEY=${OPENAI_API_KEY-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY-}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net
    x-develop:
      watch:
        - action: rebuild
          path: ./backend
    # The backend image's Dockerfile healthcheck probes FastAPI on :8000;
    # this service deliberately runs Celery instead, so inheriting that
    # probe marks a healthy worker unhealthy forever.  Use Celery's own
    # broker-mediated ping, infrequently enough for the e2-micro target.
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A backend.celery_app inspect ping -d celery@$$HOSTNAME --timeout=10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
  ui:
    build:
      context: ./frontend
      target: dev
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL-http://backend:8000}
    networks:
      - net
    x-develop:
      watch:
        - action: rebuild
          path: ./frontend
    ports:
      - 3000:5173
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - 6006:6006
      - 4317:4317
    networks:
      - net
  neo4j:
    image: neo4j:5.26-community
    environment:
      # NEO4J_AUTH format is user/password - matches NEO4J_USERNAME/
      # NEO4J_PASSWORD above (defaults only; override both via .env for
      # anything beyond local dev). Native vector index support (used by
      # backend/migrations/vector_index_migration.py) needs Neo4j 5.11+ -
      # 5.26 is a current release, no GDS plugin required (the
      # gds.similarity.cosine() brute-force calls it would have needed were
      # replaced by CREATE VECTOR INDEX / db.index.vector.queryNodes in P3
      # item 16 - vector.similarity.cosine is a Neo4j built-in, not GDS).
      - NEO4J_AUTH=${NEO4J_USERNAME-neo4j}/${NEO4J_PASSWORD-legalcontracts_local_dev}
    volumes:
      - neo4j_data:/data
    ports:
      - 7474:7474
      - 7687:7687
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - net
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      # Host-side port only (for local redis-cli access) - mapped to 6380
      # since 6379 is commonly already bound by other local Redis instances
      # on a dev machine. The backend connects via the Docker-internal
      # network (redis://redis:6379, see REDIS_URL below), which is
      # unaffected by this host mapping either way.
      - 6380:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - net

volumes:
  neo4j_data:
  redis_data:
  pdf_source_data:
  chat_attachment_data:

networks:
  net:
