name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Neo4j instance is provided rather than relying purely on
    # per-test mocking: several modules construct a module-level Neo4jGraph
    # singleton at import time (e.g. backend/shared/utils/contract_search_tool.py),
    # which requires a reachable Neo4j to even import successfully. Today
    # that import is intercepted by another test file's mock as a side
    # effect of pytest's collection order - fragile if files are renamed,
    # reordered, or run as a subset. A real service container removes that
    # dependency on collection-order luck entirely.
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci_test_password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci_test_password
      NEO4J_DATABASE: neo4j
      GOOGLE_API_KEY: ci-dummy-key
      CACHE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run test suite
        # Punch-list item 22 closed: test_ai_patterns.py and
        # test_policy_system.py were zero-assert async smoke scripts,
        # excluded here because neither had a working async-test setup and
        # both made live, unmocked LLM/Neo4j calls if ever made
        # collectible. Both converted to real, asserting, mocked tests
        # (test_ai_patterns.py's coverage absorbed into
        # test_pattern_integration.py; test_policy_system.py replaced by
        # test_policy_chunking.py) or dropped where coverage already
        # existed elsewhere (see each new file's docstring for the
        # duplication check) - no more --ignore entries needed.
        working-directory: backend
        run: uv run pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint (blocking - syntax errors and undefined names)
        # E9 (syntax errors) and F821 (undefined names) are both genuine
        # correctness bugs - the codebase was audited clean of both when
        # this workflow was introduced, so it's safe to block on them.
        working-directory: backend
        run: uv run ruff check . --select=E9,F821

      - name: Lint (full report - non-blocking)
        # Everything else configured in pyproject.toml's [tool.ruff.lint]
        # plus the wider default rule set - unused imports/variables,
        # f-string-missing-placeholders, etc. Pre-existing style debt
        # across a codebase that never had a linter before this; reported
        # for visibility, not yet enforced.
        working-directory: backend
        run: uv run ruff check . --exit-zero

  security:
    runs-on: ubuntu-latest
    # Production-readiness audit finding #6: no automated dependency
    # vulnerability scanning existed anywhere in this pipeline. Both
    # steps below are report-only (continue-on-error), not blocking -
    # deliberately, matching this file's own established precedent: the
    # `lint` job's E9/F821 check is blocking specifically because the
    # codebase was audited clean of it *first* ("safe to block on them" -
    # see that job's comment); the full ruff report stays non-blocking
    # because that backlog was never triaged. The dependency scan is in
    # the same pre-triage state today - confirmed evidence, not
    # hypothetical: `npm audit` currently reports 3 real high-severity
    # findings in Vite's dev-server chain (see the frontend step below
    # for why they don't block a real deployment). Flipping either step
    # to blocking is the natural next move once its current baseline is
    # triaged and either fixed or explicitly accepted - not before, or
    # this job would go red on its first run for reasons unrelated to
    # whatever change actually triggered it.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export locked backend dependencies for scanning
        working-directory: backend
        run: uv export --frozen --no-dev --no-hashes -o requirements-scan.txt

      - name: Backend dependency vulnerability scan (pip-audit, report-only)
        working-directory: backend
        continue-on-error: true
        run: uvx pip-audit -r requirements-scan.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency vulnerability scan (npm audit, report-only)
        # Scans devDependencies too (no --omit=dev) so known findings stay
        # visible here rather than hidden by the flag that would otherwise
        # make this job "pass" quietly (--omit=dev's package-level grouping
        # under-reports this same chain as "3 high"; the full scan below is
        # the honest number). Current confirmed baseline: 12 findings (3
        # low, 1 moderate, 8 high), all in the Vite dev-server/build-
        # toolchain chain (vite, rollup, postcss, launch-editor) - real,
        # but scoped to `vite dev`/`vite build`'s own tooling, which never
        # runs in the production image (frontend/Dockerfile's `production`
        # stage is nginx serving a static `vite build` output; no Node,
        # no Vite, no dev server at all - see that Dockerfile). Non-issue
        # for what's actually deployed; tracked here so it isn't invisible.
        working-directory: frontend
        continue-on-error: true
        run: npm audit
