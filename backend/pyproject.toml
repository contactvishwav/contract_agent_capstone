[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.11",
    "google-generativeai>=0.8.3",
    "langchain-anthropic>=0.3.10",
    "langchain-community>=0.3.20",
    "langchain-google-genai>=2.1.1",
    "langchain-mistralai>=0.2.9",
    "langchain-neo4j>=0.4.0",
    "langchain-openai>=0.3.10",
    "langgraph>=0.3.18",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "pypdf>=4.0.0",
    "pdfplumber>=0.10.0",
    "python-multipart>=0.0.6",
    "redis>=5.0.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "mcp>=0.1.0",
    "fastmcp>=0.1.0",
    "nest_asyncio>=1.6.0",
    "cryptography>=49.0.0",
    "pyjwt>=2.10.0",
    "celery[redis]>=5.4.0",
    "bcrypt>=4.2.0",
    "prometheus-client>=0.21.0",
    "slowapi>=0.1.10",
    "google-cloud-secret-manager>=2.29.0",
    "pyotp>=2.9.0",
    "httpx>=0.27.0",
    "joserfc>=1.0.0",
    "langgraph-checkpoint-redis>=0.5.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
# Only block CI on syntax errors (E9) and undefined names (F821) - real
# correctness bugs. The rest of the F-series (unused imports/variables,
# f-string-missing-placeholders, etc.) is pre-existing style debt across
# a codebase that never had a linter before this; it's surfaced in CI
# output for visibility (see .github/workflows/ci.yml's non-blocking
# `ruff check --exit-zero` step) but not enforced yet.
select = ["E9", "F821"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.2",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
# Every test file imports via the absolute `backend.xxx` package path, which
# requires the repo root (parent of this backend/ directory), not backend/
# itself, on sys.path. Locally this worked by accident (pytest always ran
# from the repo root in this session's own invocations), but CI runs pytest
# with backend/ as the working directory - added here so it works
# regardless of invocation directory.
pythonpath = [".."]
