# Production compose file for the GCP e2-micro deployment
# (docs/DEPLOYMENT.md). Deliberately a SEPARATE file from docker-
# compose.yml, not a modification of it - that file is explicitly
# dev-only (every service builds the `dev` image target, no restart
# policy, no resource limits - see README.md's note on it), and mixing
# dev/prod concerns in one file invites exactly the kind of drift this
# split avoids.
#
# Differences from docker-compose.yml, all deliberate:
# - Every service builds the `production` image target (no hot-reload,
#   no dev dependencies, non-root user - see each Dockerfile).
# - No local `neo4j` service - NEO4J_URI points at a real Neo4j AuraDB
#   Free instance instead (neo4j+s://<dbid>.databases.neo4j.io). No code
#   change needed for this: langchain_neo4j.Neo4jGraph already reads
#   NEO4J_URI/NEO4J_USERNAME/NEO4J_PASSWORD/NEO4J_DATABASE straight from
#   the environment and is scheme-agnostic (bolt/neo4j, plain or +s/+ssc
#   for TLS) - the "connection" is purely an env-var value, not a code
#   path.
# - No local `phoenix` service (LLM tracing) - optional infra this
#   memory-constrained VM doesn't have room for; main.py's own tracing
#   init already no-ops (logs a warning, doesn't crash) if
#   PHOENIX_COLLECTOR_ENDPOINT is unreachable, so simply not running it
#   is safe. Point PHOENIX_COLLECTOR_ENDPOINT at a real external Phoenix
#   instance later if LLM tracing is ever wanted here.
# - `restart: unless-stopped` on every service (absent everywhere in the
#   dev file on purpose - a crash-looping dev container should be loud,
#   not silently restarted) - here, a crashed container should come back
#   without an SSH session and a manual `docker compose up`.
# - `mem_limit` on every service, sized for e2-micro's 1GB total RAM
#   shared across the whole VM (OS + Docker daemon + every container
#   here) - see docs/DEPLOYMENT.md's resource-fit section for the
#   arithmetic behind these specific numbers. Prevents any one runaway
#   container (a large PDF, a pathological LLM response) from starving
#   the others or OOMing the host outright.
# - worker's Celery command pins --concurrency=1 --pool=solo - the
#   dev/default (unset, so `os.cpu_count()` prefork workers) would try
#   to fork multiple full copies of this process's memory footprint
#   (LLMManager + the whole LangChain import surface) on a box that
#   can't spare it. Solo is single-threaded, appropriate for e2-micro's
#   burstable/shared vCPUs and this workload's low expected concurrency
#   (a personal/demo deployment, not a high-traffic service).
# - redis gets an explicit --maxmemory + eviction policy - the dev
#   file's redis has no cap at all (fine on a dev machine with plenty of
#   spare RAM; not fine when it's sharing 1GB with everything else).
#
# TLS termination: Caddy (see ../Caddyfile for the recommendation
# rationale - automatic Let's Encrypt vs. nginx+certbot's extra moving
# parts) is the only service bound to host ports 80/443. `ui` is
# internal-network-only - Caddy reverse-proxies everything to it, and
# nginx.conf.template's own location /api/ still owns proxying to
# `backend` internally, unchanged.
#
# Every buildable service declares BOTH `build:` and `image:` - not
# redundant, two different workflows read different halves of it:
#   - `docker compose -f docker-compose.prod.yml build` (anywhere with
#     the source checked out, e.g. your dev machine) builds via `build:`
#     and tags the result with `image:`, ready to `docker push`.
#   - On the e2-micro VM itself: `docker compose -f docker-compose.prod.yml
#     pull` fetches by `image:` alone - `build:` is simply ignored by
#     `pull`. Building on the VM (npm/vite/uv/tsc, the whole toolchain)
#     is not something e2-micro's 1GB/burstable-vCPU budget should be
#     spent on - see docs/DEPLOYMENT.md's build-elsewhere step.
# IMAGE_REGISTRY is your pushable registry path, e.g.
# us-central1-docker.pkg.dev/<project-id>/<repo-name> for GCP Artifact
# Registry (docs/DEPLOYMENT.md walks through provisioning one).

services:
  backend:
    build:
      context: ./backend
      target: production
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY, e.g. us-central1-docker.pkg.dev/your-project/contract-agent}/backend:latest
    environment:
      - ENVIRONMENT=production
      - NEO4J_URI=${NEO4J_URI:?Set NEO4J_URI to your Aura connection string, e.g. neo4j+s://<dbid>.databases.neo4j.io}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD to your Aura instance password}
      - NEO4J_DATABASE=${NEO4J_DATABASE-neo4j}
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=true
      # Search re-ranking (backend/agents/reranker_service.py) - defaults
      # off. Deployable without changing live search behavior; enable
      # deliberately (set RERANKING_ENABLED=true here or in the real
      # .env.production on the VM) only after verifying stable under real
      # production load. See docs/DEPLOYMENT.md's rollout guidance. Only
      # this service, not worker below - reranking lives in the FastAPI
      # search route, not the Celery analysis task.
      - RERANKING_ENABLED=${RERANKING_ENABLED-false}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?Set GOOGLE_API_KEY}
      # Real multi-provider LLM fallback (backend/agents/llm_fallback_
      # service.py), added after a real production incident where Gemini
      # was the only configured provider and its only working model hit a
      # quota wall. Optional, not required (`-` default, not `:?`) -
      # unlike GOOGLE_API_KEY, the app is fully functional without these;
      # they only add resilience if/when Gemini itself is unavailable.
      - OPENAI_API_KEY=${OPENAI_API_KEY-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to a real generated secret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to a real generated secret (or set KEY_PROVIDER=gcp below and this is ignored)}
      - KEY_PROVIDER=${KEY_PROVIDER-env}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID-}
      - GCP_SECRET_ID=${GCP_SECRET_ID-ENCRYPTION_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to your real frontend origin, e.g. https://your-domain.example}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - net
    restart: unless-stopped
    # Empirically measured (real production image, real Neo4j, idle after
    # startup): 246 MiB RSS. 300m leaves headroom for a large-contract
    # request without being generous enough to starve everything else on
    # e2-micro's 1GB - see docs/DEPLOYMENT.md's resource-fit section.
    mem_limit: 300m
    ports:
      # Not required once the reverse proxy (item 3) lands - kept for now
      # so /api/monitoring/health is directly reachable during setup/the
      # Aura connectivity test. Should not be left open in the VM's GCP
      # firewall long-term; only 80/443 need to be.
      - "8000:8000"

  worker:
    build:
      context: ./backend
      target: production
    # Same image as `backend` (not a separate build - just a different
    # command), same tag as that service's `image:` above.
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY, e.g. us-central1-docker.pkg.dev/your-project/contract-agent}/backend:latest
    command: ["celery", "-A", "backend.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--pool=solo"]
    stop_grace_period: 45s
    environment:
      - ENVIRONMENT=production
      - NEO4J_URI=${NEO4J_URI:?Set NEO4J_URI to your Aura connection string, e.g. neo4j+s://<dbid>.databases.neo4j.io}
      - NEO4J_USERNAME=${NEO4J_USERNAME-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD to your Aura instance password}
      - NEO4J_DATABASE=${NEO4J_DATABASE-neo4j}
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=true
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?Set GOOGLE_API_KEY}
      # See backend service's identical comment above - real
      # multi-provider LLM fallback, optional.
      - OPENAI_API_KEY=${OPENAI_API_KEY-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to a real generated secret (or set KEY_PROVIDER=gcp below and this is ignored)}
      - KEY_PROVIDER=${KEY_PROVIDER-env}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID-}
      - GCP_SECRET_ID=${GCP_SECRET_ID-ENCRYPTION_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - net
    restart: unless-stopped
    # Empirically measured (--concurrency=1 --pool=solo, real production
    # image, idle after startup): 236 MiB RSS.
    mem_limit: 280m
    # This service shares backend's image, which bakes in an HTTP
    # HEALTHCHECK (backend/Dockerfile) checking :8000/api/monitoring/
    # health - meaningless here, since a Celery worker never runs a web
    # server at all. Found live in the real deployment (docs/DEPLOYMENT.md):
    # without an override, `docker ps` reports the worker "unhealthy"
    # forever, even when it's genuinely fine.
    #
    # NOT a `celery inspect ping` check, on purpose - tried that first,
    # and found live (same deployment) that it actively crash-loops the
    # worker on e2-micro: `celery inspect` is a *separate* CLI invocation
    # that imports backend.celery_app fresh - which imports backend.tasks,
    # which constructs its own full LLMManager() at module level (see
    # tasks.py's own docstring on why - a second, full copy of the
    # LangChain/Google-genai import surface). Running that every 30s
    # alongside the already-running worker process (which has its own
    # LLMManager already resident) blew well past this service's 280m
    # limit and crashed it repeatedly (confirmed: RestartCount climbing,
    # CPU% over 1000 during the healthcheck's own import phase). Disabled
    # entirely instead. This trades away detecting a wedged-but-still-
    # running worker (Docker's restart policy only reacts to the process
    # actually exiting, not to a failing healthcheck, by default) - but a
    # worker that genuinely crashes still gets restarted via
    # `restart: unless-stopped`, and finding #8's task_acks_late=True
    # means whatever task it was mid-processing when it went down is
    # safely requeued either way, not lost.
    healthcheck:
      disable: true

  ui:
    build:
      context: ./frontend
      target: production
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY, e.g. us-central1-docker.pkg.dev/your-project/contract-agent}/ui:latest
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
    networks:
      - net
    restart: unless-stopped
    # Empirically measured (nginx serving the real built bundle): 7 MiB
    # RSS. 40m is already generous headroom.
    mem_limit: 40m
    # No host port mapping - internal-network-only, sits behind Caddy.

  caddy:
    image: caddy:2-alpine
    environment:
      # Gate for automatic Let's Encrypt (docs/DEPLOYMENT.md item 3) -
      # set DOMAIN to your real domain once DNS is pointed at this VM's
      # static IP. Unset/default falls back to plain HTTP on :80 (see
      # ../Caddyfile) so the stack is reachable before that's ready.
      - DOMAIN=${DOMAIN-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
    networks:
      - net
    restart: unless-stopped
    # Empirically measured (idle, no TLS traffic yet): 13.5 MiB RSS.
    # 64m leaves headroom for TLS handshake/cert-renewal activity.
    mem_limit: 64m

  redis:
    image: redis:7-alpine
    # No local dev-style unbounded cache here - capped well within
    # e2-micro's budget, with the standard eviction policy for a cache
    # workload (evict the least-recently-used key once full, rather than
    # refusing writes or crashing).
    command: ["redis-server", "--maxmemory", "150mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - net
    restart: unless-stopped
    # --maxmemory 150mb plus redis's own connection/overhead beyond that
    # cap (typically 15-25%) - 160m keeps a real OOM from being triggered
    # by that overhead alone. Empirically measured idle (no cached
    # entries yet): under 10 MiB.
    mem_limit: 160m

volumes:
  redis_data:
  # Caddy's ACME account + issued certificates/keys - persisted so a
  # container restart doesn't re-issue from Let's Encrypt every time
  # (their rate limits are generous but there's no reason to burn them).
  caddy_data:
  caddy_config:

networks:
  net:
